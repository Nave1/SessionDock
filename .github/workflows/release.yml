name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Rust format check
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

      - name: Verify updater signing key
        shell: pwsh
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_SIGNING_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured to publish signed updates."
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_SIGNING_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured to publish signed updates."
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SessionDock ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Retain current and previous releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin master
          git checkout -B master origin/master
          ./scripts/retain-releases.ps1 -Repository ${{ github.repository }}
          git add --all --force release
          if (-not (git diff --cached --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Retain release backups for ${{ github.ref_name }}"
            git push origin master
          }
